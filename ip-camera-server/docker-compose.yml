services:
  app:
    build:
      context: ..
      dockerfile: ip-camera-server/Dockerfile
    container_name: phonecam-app
    restart: unless-stopped
    environment:
      PORT: "8090"
      CAMERA_TOKEN: ${CAMERA_TOKEN}
      RTSP_TARGET: "rtsp://mediamtx:8554/phonecam"
    depends_on:
      - mediamtx

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: phonecam-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  onvif-proxy:
    image: ghcr.io/aiaid/onvif-proxy:latest
    container_name: phonecam-onvif
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "8080:8080/tcp"
      - "8081:8081/tcp"
      - "8554:8554/tcp"
    volumes:
      - ./onvif-config:/config
    environment:
      ONVIF_ADVERTISE_IP: ${HOST_IP}
      ONVIF_DISCOVERY: "false"
      ONVIF_WEB_USERNAME: ${ONVIF_WEB_USERNAME:-admin}
      ONVIF_WEB_PASSWORD: ${ONVIF_WEB_PASSWORD}

  caddy:
    image: caddy:2
    container_name: ip-camera-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      HOST_IP: ${HOST_IP}
    ports:
      - "8443:8443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: